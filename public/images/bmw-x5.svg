<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- Ground -->
  <rect x="0" y="200" width="400" height="50" fill="#0d0d1a"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="201" rx="165" ry="7" fill="rgba(0,0,0,0.7)"/>
  <!-- SUV Lower body -->
  <rect x="35" y="138" width="330" height="62" rx="10" fill="url(#body)" stroke="#444444" stroke-width="1.5"/>
  <!-- SUV Cabin (taller) -->
  <path d="M 72,138 L 85,92 L 315,92 L 335,138 Z" fill="url(#roof)" stroke="#444444" stroke-width="1.5"/>
  <!-- Windows -->
  <path d="M 90,136 L 99,97 L 185,97 L 185,136 Z" fill="#6AB4D8" opacity="0.7" stroke="#4A90B8" stroke-width="1"/>
  <path d="M 190,136 L 190,97 L 300,97 L 315,136 Z" fill="#6AB4D8" opacity="0.7" stroke="#4A90B8" stroke-width="1"/>
  <!-- B-pillar -->
  <rect x="185" y="96" width="6" height="42" fill="#333333"/>
  <!-- Chrome strip -->
  <rect x="35" y="155" width="330" height="4" rx="2" fill="#888888"/>
  <!-- Door handles -->
  <rect x="252" y="166" width="22" height="5" rx="2" fill="#555555"/>
  <rect x="135" y="166" width="22" height="5" rx="2" fill="#555555"/>
  <!-- Roof rails -->
  <rect x="85" y="89" width="230" height="4" rx="2" fill="#555555"/>
  <!-- Headlights - BMW kidney style -->
  <path d="M 350,140 L 362,140 L 365,155 L 350,158 Z" fill="#FFFFBB" opacity="0.95"/>
  <path d="M 348,143 L 354,143 L 354,155 L 348,155 Z" fill="#FFFFFF" opacity="0.5"/>
  <!-- DRL strip -->
  <rect x="335" y="140" width="18" height="3" rx="1" fill="#FFFFFF" opacity="0.8"/>
  <!-- Taillights -->
  <rect x="35" y="143" width="10" height="20" rx="2" fill="#CC2222" opacity="0.9"/>
  <rect x="36" y="148" width="6" height="10" rx="1" fill="#FF4444" opacity="0.7"/>
  <!-- Front wheel -->
  <circle cx="305" cy="200" r="36" fill="#111111"/>
  <circle cx="305" cy="200" r="26" fill="#1A1A1A"/>
  <circle cx="305" cy="200" r="15" fill="#C8C8C8" stroke="#888" stroke-width="1.5"/>
  <circle cx="305" cy="200" r="5" fill="#777777"/>
  <line x1="305" y1="185" x2="305" y2="215" stroke="#888" stroke-width="2"/>
  <line x1="290" y1="200" x2="320" y2="200" stroke="#888" stroke-width="2"/>
  <line x1="295" y1="189" x2="315" y2="211" stroke="#888" stroke-width="1.5"/>
  <line x1="315" y1="189" x2="295" y2="211" stroke="#888" stroke-width="1.5"/>
  <!-- Rear wheel -->
  <circle cx="102" cy="200" r="36" fill="#111111"/>
  <circle cx="102" cy="200" r="26" fill="#1A1A1A"/>
  <circle cx="102" cy="200" r="15" fill="#C8C8C8" stroke="#888" stroke-width="1.5"/>
  <circle cx="102" cy="200" r="5" fill="#777777"/>
  <line x1="102" y1="185" x2="102" y2="215" stroke="#888" stroke-width="2"/>
  <line x1="87" y1="200" x2="117" y2="200" stroke="#888" stroke-width="2"/>
  <line x1="92" y1="189" x2="112" y2="211" stroke="#888" stroke-width="1.5"/>
  <line x1="112" y1="189" x2="92" y2="211" stroke="#888" stroke-width="1.5"/>
  <!-- Brand label -->
  <rect x="100" y="218" width="200" height="26" rx="5" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="233" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#E8A020" text-anchor="middle">BMW X5</text>
  <text x="200" y="243" font-family="Arial,sans-serif" font-size="9" fill="#AAAAAA" text-anchor="middle">2024 · Внедорожник</text>
</svg>
