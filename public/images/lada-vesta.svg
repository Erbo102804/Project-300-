<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E8B2E"/>
      <stop offset="100%" stop-color="#1A5C1A"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#267826"/>
      <stop offset="100%" stop-color="#145014"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <rect x="0" y="200" width="400" height="50" fill="#0d0d1a"/>
  <ellipse cx="200" cy="201" rx="158" ry="7" fill="rgba(0,0,0,0.6)"/>
  <!-- Lower body sedan -->
  <rect x="42" y="150" width="316" height="50" rx="8" fill="url(#body)" stroke="#226622" stroke-width="1"/>
  <!-- Cabin -->
  <path d="M 108,150 L 124,110 L 278,110 L 296,150 Z" fill="url(#roof)" stroke="#226622" stroke-width="1"/>
  <!-- Windows -->
  <path d="M 124,148 L 137,114 L 196,114 L 196,148 Z" fill="#A8D8F0" opacity="0.78" stroke="#7BBAD4" stroke-width="1"/>
  <path d="M 201,148 L 201,114 L 265,114 L 280,148 Z" fill="#A8D8F0" opacity="0.78" stroke="#7BBAD4" stroke-width="1"/>
  <rect x="196" y="113" width="6" height="37" fill="#1E661E"/>
  <!-- Chrome strip -->
  <rect x="42" y="160" width="316" height="2.5" rx="1" fill="#44AA44" opacity="0.5"/>
  <!-- Door handles -->
  <rect x="248" y="167" width="20" height="5" rx="2" fill="#1E661E"/>
  <rect x="138" y="167" width="20" height="5" rx="2" fill="#1E661E"/>
  <!-- Headlights -->
  <path d="M 350,154 L 358,151 L 358,163 L 350,166 Z" fill="#FFFFBB" opacity="0.95"/>
  <rect x="338" y="151" width="14" height="3" rx="1" fill="#FFFFFF" opacity="0.8"/>
  <!-- Taillights -->
  <rect x="42" y="155" width="10" height="14" rx="2" fill="#DD2222" opacity="0.9"/>
  <rect x="43" y="159" width="6" height="6" rx="1" fill="#FF4444" opacity="0.65"/>
  <!-- Front wheel -->
  <circle cx="298" cy="198" r="33" fill="#111111"/>
  <circle cx="298" cy="198" r="23" fill="#1E1E1E"/>
  <circle cx="298" cy="198" r="13" fill="#C8C8C8" stroke="#999" stroke-width="1.5"/>
  <circle cx="298" cy="198" r="4" fill="#888"/>
  <line x1="298" y1="185" x2="298" y2="211" stroke="#999" stroke-width="1.5"/>
  <line x1="285" y1="198" x2="311" y2="198" stroke="#999" stroke-width="1.5"/>
  <!-- Rear wheel -->
  <circle cx="110" cy="198" r="33" fill="#111111"/>
  <circle cx="110" cy="198" r="23" fill="#1E1E1E"/>
  <circle cx="110" cy="198" r="13" fill="#C8C8C8" stroke="#999" stroke-width="1.5"/>
  <circle cx="110" cy="198" r="4" fill="#888"/>
  <line x1="110" y1="185" x2="110" y2="211" stroke="#999" stroke-width="1.5"/>
  <line x1="97" y1="198" x2="123" y2="198" stroke="#999" stroke-width="1.5"/>
  <!-- Brand label -->
  <rect x="100" y="218" width="200" height="26" rx="5" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="233" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#E8A020" text-anchor="middle">Lada Vesta</text>
  <text x="200" y="243" font-family="Arial,sans-serif" font-size="9" fill="#AAAAAA" text-anchor="middle">2023 · Седан</text>
</svg>
