<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8D8D8"/>
      <stop offset="100%" stop-color="#A8A8A8"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8C8C8"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- Ground -->
  <rect x="0" y="200" width="400" height="50" fill="#0d0d1a"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="201" rx="162" ry="7" fill="rgba(0,0,0,0.6)"/>
  <!-- Crossover Lower body -->
  <rect x="38" y="142" width="324" height="58" rx="10" fill="url(#body)" stroke="#AAAAAA" stroke-width="1"/>
  <!-- Crossover Cabin -->
  <path d="M 78,142 L 90,100 L 310,100 L 328,142 Z" fill="url(#roof)" stroke="#AAAAAA" stroke-width="1"/>
  <!-- Windows -->
  <path d="M 94,140 L 103,105 L 190,105 L 190,140 Z" fill="#A8D8F0" opacity="0.8" stroke="#7BBAD4" stroke-width="1"/>
  <path d="M 195,140 L 195,105 L 298,105 L 312,140 Z" fill="#A8D8F0" opacity="0.8" stroke="#7BBAD4" stroke-width="1"/>
  <!-- B-pillar -->
  <rect x="190" y="104" width="6" height="38" fill="#BBBBBB"/>
  <!-- Chrome waist line -->
  <rect x="38" y="157" width="324" height="3" rx="1" fill="#CCCCCC"/>
  <!-- Door handles -->
  <rect x="255" y="166" width="20" height="5" rx="2" fill="#999999"/>
  <rect x="138" y="166" width="20" height="5" rx="2" fill="#999999"/>
  <!-- Headlights (Tucson-style sharp) -->
  <path d="M 352,142 L 362,138 L 362,158 L 352,162 Z" fill="#FFFFBB" opacity="0.9"/>
  <line x1="336" y1="138" x2="362" y2="138" stroke="#DDDDFF" stroke-width="2.5" opacity="0.9"/>
  <!-- Taillights -->
  <rect x="38" y="145" width="10" height="18" rx="2" fill="#EE2222" opacity="0.9"/>
  <line x1="38" y1="145" x2="38" y2="160" stroke="#FF4444" stroke-width="3" opacity="0.6"/>
  <!-- Front wheel -->
  <circle cx="302" cy="199" r="35" fill="#111111"/>
  <circle cx="302" cy="199" r="25" fill="#1E1E1E"/>
  <circle cx="302" cy="199" r="14" fill="#C8C8C8" stroke="#999" stroke-width="1.5"/>
  <circle cx="302" cy="199" r="5" fill="#888888"/>
  <line x1="302" y1="185" x2="302" y2="213" stroke="#999" stroke-width="1.5"/>
  <line x1="288" y1="199" x2="316" y2="199" stroke="#999" stroke-width="1.5"/>
  <!-- Rear wheel -->
  <circle cx="105" cy="199" r="35" fill="#111111"/>
  <circle cx="105" cy="199" r="25" fill="#1E1E1E"/>
  <circle cx="105" cy="199" r="14" fill="#C8C8C8" stroke="#999" stroke-width="1.5"/>
  <circle cx="105" cy="199" r="5" fill="#888888"/>
  <line x1="105" y1="185" x2="105" y2="213" stroke="#999" stroke-width="1.5"/>
  <line x1="91" y1="199" x2="119" y2="199" stroke="#999" stroke-width="1.5"/>
  <!-- Brand label -->
  <rect x="100" y="218" width="200" height="26" rx="5" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="233" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#E8A020" text-anchor="middle">Hyundai Tucson</text>
  <text x="200" y="243" font-family="Arial,sans-serif" font-size="9" fill="#AAAAAA" text-anchor="middle">2023 · Кроссовер</text>
</svg>
