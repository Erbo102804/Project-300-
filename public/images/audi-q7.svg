<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#555555"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#777777"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <rect x="0" y="200" width="400" height="50" fill="#0d0d1a"/>
  <ellipse cx="200" cy="201" rx="166" ry="7" fill="rgba(0,0,0,0.7)"/>
  <!-- Lower body SUV (large) -->
  <rect x="33" y="135" width="334" height="65" rx="11" fill="url(#body)" stroke="#666666" stroke-width="1.5"/>
  <!-- Cabin (wide, tall) -->
  <path d="M 68,135 L 80,90 L 320,90 L 340,135 Z" fill="url(#roof)" stroke="#666666" stroke-width="1.5"/>
  <!-- Windows -->
  <path d="M 85,133 L 94,95 L 185,95 L 185,133 Z" fill="#6AB4D8" opacity="0.72" stroke="#4A90B8" stroke-width="1"/>
  <path d="M 190,133 L 190,95 L 305,95 L 322,133 Z" fill="#6AB4D8" opacity="0.72" stroke="#4A90B8" stroke-width="1"/>
  <rect x="185" y="94" width="6" height="41" fill="#555555"/>
  <!-- Chrome accent -->
  <rect x="33" y="153" width="334" height="4" rx="2" fill="#999999"/>
  <!-- Door handles -->
  <rect x="257" y="163" width="22" height="5" rx="2" fill="#666666"/>
  <rect x="132" y="163" width="22" height="5" rx="2" fill="#666666"/>
  <!-- Roof rails -->
  <rect x="80" y="87" width="240" height="4" rx="2" fill="#666666"/>
  <!-- Headlights (Audi LED style) -->
  <path d="M 349,138 L 366,133 L 366,155 L 349,160 Z" fill="#FFFFBB" opacity="0.95"/>
  <rect x="333" y="133" width="18" height="3" rx="1" fill="#FFFFFF" opacity="0.9"/>
  <rect x="333" y="138" width="14" height="2" rx="1" fill="#FFFFEE" opacity="0.8"/>
  <!-- Taillights -->
  <rect x="33" y="140" width="11" height="22" rx="2" fill="#CC1111" opacity="0.95"/>
  <rect x="34" y="145" width="7" height="12" rx="1" fill="#FF3333" opacity="0.7"/>
  <!-- Front wheel (large) -->
  <circle cx="308" cy="200" r="37" fill="#111111"/>
  <circle cx="308" cy="200" r="27" fill="#1A1A1A"/>
  <circle cx="308" cy="200" r="16" fill="#CCCCCC" stroke="#888" stroke-width="1.5"/>
  <circle cx="308" cy="200" r="5" fill="#777"/>
  <line x1="308" y1="184" x2="308" y2="216" stroke="#888" stroke-width="2"/>
  <line x1="292" y1="200" x2="324" y2="200" stroke="#888" stroke-width="2"/>
  <line x1="297" y1="189" x2="319" y2="211" stroke="#888" stroke-width="1.5"/>
  <line x1="319" y1="189" x2="297" y2="211" stroke="#888" stroke-width="1.5"/>
  <!-- Rear wheel (large) -->
  <circle cx="99" cy="200" r="37" fill="#111111"/>
  <circle cx="99" cy="200" r="27" fill="#1A1A1A"/>
  <circle cx="99" cy="200" r="16" fill="#CCCCCC" stroke="#888" stroke-width="1.5"/>
  <circle cx="99" cy="200" r="5" fill="#777"/>
  <line x1="99" y1="184" x2="99" y2="216" stroke="#888" stroke-width="2"/>
  <line x1="83" y1="200" x2="115" y2="200" stroke="#888" stroke-width="2"/>
  <line x1="88" y1="189" x2="110" y2="211" stroke="#888" stroke-width="1.5"/>
  <line x1="110" y1="189" x2="88" y2="211" stroke="#888" stroke-width="1.5"/>
  <!-- Brand label -->
  <rect x="100" y="218" width="200" height="26" rx="5" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="233" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#E8A020" text-anchor="middle">Audi Q7</text>
  <text x="200" y="243" font-family="Arial,sans-serif" font-size="9" fill="#AAAAAA" text-anchor="middle">2024 · Внедорожник</text>
</svg>
